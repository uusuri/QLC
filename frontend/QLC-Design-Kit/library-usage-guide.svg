<text x="158" y="258" font-family="IBM Plex Mono, Menlo, monospace" font-size="20" font-weight="400" fill="#C4FF00">128 → 64 → 32</text>
<text x="64" y="326" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="500" fill="#F5F5EF">30 знаков</text>
<text x="64" y="363" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Слот: 128 × 128.</text>
<text x="64" y="395" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Размеры: 32 / 64 / 128.</text>
<text x="64" y="427" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">Смена знака: Instance swap.</text>
<text x="64" y="459" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">Масштабирование: K → Scale.</text>
<text x="64" y="491" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">Ищите по имени в таблице.</text>
