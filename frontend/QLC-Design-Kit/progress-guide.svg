<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790"><rect x="0" y="0" width="1200" height="790" fill="#0A0A0A"/><text x="48" y="49" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#C4FF00">QLC / PROGRESS</text><text x="48" y="104" font-family="Inter" font-size="36" font-weight="400" fill="#F5F5EF">Непрерывное заполнение</text><text x="48" y="142" font-family="Inter" font-size="16" font-weight="400" fill="#A6A6A0">Любое значение от 0 до 100. Проценты — данные, а не набор вариантов.</text><path d="M48 177H1152" stroke="#303030"/><g transform="translate(48 220)"><g id="Label"><text x="0" y="16" font-family="Inter" font-size="14" font-weight="400" fill="#F5F5EF">Прогресс курса</text><text x="307" y="16" font-family="IBM Plex Mono" font-size="13" font-weight="400" fill="#C4FF00">37,6%</text></g><g id="Continuous-track" transform="translate(0 32)"><g id="Track"><rect x="0" y="0" width="360" height="6" fill="#262626"/><rect id="Fill-value-37.6" width="135.360" height="6" fill="#C4FF00"/></g></g><text x="0" y="59" font-family="Inter" font-size="11" font-weight="400" fill="#A6A6A0">Продолжайте с текущего урока</text></g><g transform="translate(48 350)"><g id="XP-label"><text x="0" y="18" font-family="Inter" font-size="17" font-weight="400" fill="#F5F5EF">Уровень 07</text><text x="240" y="18" font-family="IBM Plex Mono" font-size="11" font-weight="400" fill="#C4FF00">2 172 / 3 000 XP</text></g><g id="Continuous-XP-track" transform="translate(0 42)"><g id="Track"><rect x="0" y="0" width="360" height="6" fill="#262626"/><rect id="Fill-value-72.4" width="260.640" height="6" fill="#C4FF00"/></g></g><text x="0" y="73" font-family="Inter" font-size="12" font-weight="400" fill="#A6A6A0">До следующего уровня</text><text x="307" y="73" font-family="IBM Plex Mono" font-size="12" font-weight="400" fill="#F5F5EF">828 XP</text></g><g transform="translate(960 233)"><circle cx="60" cy="60" r="42" fill="none" stroke="#262626" stroke-width="5"/><path id="Arc-value-83.7" d="M60 18 A42 42 0 1 1 24.12035 38.16767" fill="none" stroke="#C4FF00" stroke-width="5"/><text x="29" y="66" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#F5F5EF">83,7%</text><path d="M0 60H8M112 60H120M60 0V8M60 112V120" stroke="#656565"/></g><text x="506" y="242" font-family="Inter" font-size="18" font-weight="400" fill="#F5F5EF">Одна сплошная шкала</text><text x="506" y="275" font-family="IBM Plex Mono" font-size="18" font-weight="400" fill="#C4FF00">0 → 37,6 → 72,4 → 100</text><text x="506" y="309" font-family="Inter" font-size="14" font-weight="400" fill="#A6A6A0">Заполнение пропорционально значению.</text><text x="506" y="335" font-family="Inter" font-size="14" font-weight="400" fill="#A6A6A0">Без делений и округления геометрии.</text><text x="506" y="391" font-family="Inter" font-size="16" font-weight="400" fill="#F5F5EF">Linear / XP / Circular</text><text x="506" y="422" font-family="Inter" font-size="14" font-weight="400" fill="#A6A6A0">Одна модель данных для всех трёх форм.</text><path d="M48 480H1152" stroke="#303030"/><text x="48" y="522" font-family="Inter" font-size="22" font-weight="400" fill="#F5F5EF">Правила для реализации</text><text x="48" y="561" font-family="Inter" font-size="14" font-weight="400" fill="#F5F5EF">value: number  •  min: 0  •  max: 100  •  дробные значения допустимы</text><text x="48" y="591" font-family="Inter" font-size="14" font-weight="400" fill="#A6A6A0">Заполнение: clamp(value, 0, 100) / 100 × ширина шкалы.</text><text x="48" y="621" font-family="Inter" font-size="14" font-weight="400" fill="#A6A6A0">Переход: 240 ms ease-out; prefers-reduced-motion: без анимации.</text><text x="48" y="651" font-family="Inter" font-size="14" font-weight="400" fill="#A6A6A0">Подпись округляется отдельно. Реальная ширина сохраняет точность.</text><text x="48" y="681" font-family="Inter" font-size="14" font-weight="400" fill="#A6A6A0">0: пустая шкала. 100: заполненная. Неизвестное значение: отдельное состояние.</text><text x="48" y="711" font-family="Inter" font-size="14" font-weight="400" fill="#A6A6A0">Figma: визуальная спецификация. Значение и анимация подключаются в TypeScript.</text></svg>