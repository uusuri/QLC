<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180"><title>Popover / default</title><rect x="0" y="0" width="320" height="180" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1"/><text x="20" y="37" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="#F5F5EF">Как считается прогресс</text><text x="20" y="66.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Доля завершённых обязательных</text><text x="20" y="87.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">заданий. Прочитанный текст</text><text x="20" y="108.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">считается отдельно.</text></svg>