<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320"><title>Content/Block / subtitle</title><text x="24" y="60" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#F5F5EF">HashMap: поиск по ключу</text><text x="24" y="108.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Коллекция связывает ключ со значением. Найти</text><text x="24" y="135.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">данные можно по ключу, без последовательного</text><text x="24" y="162.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">просмотра всех элементов.</text></svg>