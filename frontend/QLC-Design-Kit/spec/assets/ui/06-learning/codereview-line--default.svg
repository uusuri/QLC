<svg xmlns="http://www.w3.org/2000/svg" width="560" height="116" viewBox="0 0 560 116"><title>CodeReview/Line / default</title><rect x="0" y="0" width="560" height="78" rx="2" fill="#0A0A0A" stroke="#32372E" stroke-width="1" opacity="1"/><text x="12" y="31" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">1</text><text x="44" y="31" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">Integer count = cache.get(key);</text><text x="12" y="56" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">2</text><text x="44" y="56" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">cache.put(key, count + 1);</text><text x="12" y="99" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A6A6A0">Добавить замечание к выбранным строкам</text></svg>