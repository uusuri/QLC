<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330"><title>Incident/Evidence / code</title><rect x="0" y="0" width="560" height="330" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1"/><text x="20" y="29" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="400" fill="#A6A6A0">EVIDENCE / CODE</text><text x="20" y="64" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Фрагмент обработчика</text><rect x="16" y="88" width="528" height="103" rx="2" fill="#0A0A0A" stroke="#32372E" stroke-width="1" opacity="1"/><text x="28" y="119" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">1</text><text x="60" y="119" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">Connection connection = pool.get();</text><text x="28" y="144" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">2</text><text x="60" y="144" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">Order order = readOrder(connection);</text><text x="28" y="169" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">3</text><text x="60" y="169" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#C4FF00">return order;</text><text x="20" y="316" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#A6A6A0">Учебные данные · доступно для расследования</text></svg>