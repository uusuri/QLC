<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320"><title>Content/Block / quote</title><rect x="20" y="26" width="3" height="220" rx="0" fill="#A6A6A0" opacity="1"/><text x="44" y="63" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">Из документации</text><text x="44" y="105.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">Ключи должны сохранять согласованность equals</text><text x="44" y="132.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">и hashCode. Изменение ключа после вставки</text><text x="44" y="159.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">может нарушить поиск.</text></svg>