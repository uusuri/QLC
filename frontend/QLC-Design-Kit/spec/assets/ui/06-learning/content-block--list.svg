<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320"><title>Content/Block / list</title><rect x="0" y="0" width="560" height="320" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1"/><text x="24" y="54" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#C4FF00">01</text><text x="62" y="54" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Создайте коллекцию.</text><text x="24" y="122" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#C4FF00">02</text><text x="62" y="122" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Добавьте пары ключ–значение.</text><text x="24" y="190" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#C4FF00">03</text><text x="62" y="190" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Проверьте результат поиска.</text></svg>