<svg xmlns="http://www.w3.org/2000/svg" width="560" height="116" viewBox="0 0 560 116"><title>CodeReview/Line / with-finding</title><rect x="0" y="0" width="560" height="78" rx="2" fill="#0A0A0A" stroke="#32372E" stroke-width="1" opacity="1"/><rect x="1" y="14" width="558" height="25" rx="0" fill="#4433EE" opacity="1"/><text x="12" y="31" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">1</text><text x="44" y="31" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">Integer count = cache.get(key);</text><text x="12" y="56" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">2</text><text x="44" y="56" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">cache.put(key, count + 1);</text><rect x="396" y="77" width="156" height="26" rx="2" fill="none" stroke="#E9D774" stroke-width="1" opacity="1"/><text x="408" y="95" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="400" fill="#E9D774">ЗАМЕЧАНИЕ</text></svg>