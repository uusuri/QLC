<svg xmlns="http://www.w3.org/2000/svg" width="360" height="228" viewBox="0 0 360 228"><title>Textarea / error</title><text x="4" y="12" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A6A6A0">Ваше объяснение</text><rect x="4" y="22" width="352" height="48" rx="2" fill="#101210" stroke="#FF8074" stroke-width="1" opacity="1"/><text x="18" y="52" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F5F5EF">Введите значение</text><rect x="4" y="22" width="352" height="136" rx="2" fill="#101210" stroke="#FF8074" stroke-width="1" opacity="1"/><text x="18" y="52.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F5F5EF">Проблема возникает при</text><text x="18" y="76.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F5F5EF">одновременном обновлении данных.</text><text x="18" y="100.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F5F5EF">Изменение должно выполняться</text><text x="18" y="124.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#F5F5EF">атомарно.</text><text x="4" y="184" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#FF8074">Объясните причину, а не только действие.</text><text x="356" y="214" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A6A6A0" text-anchor="end">127 / 2 000</text></svg>