<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1540" viewBox="0 0 1536 1540"><title>06-learning</title><rect x="0" y="0" width="1536" height="1540" rx="0" fill="#0A0A0A" opacity="1"/><text x="24" y="35" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">QLC / 06-learning / 1</text><text x="24" y="84" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#A6A6A0">Content/Block</text><svg xmlns="http://www.w3.org/2000/svg" width="488.0" height="278.8571428571429" viewBox="0 0 560 320" x="24" y="106"><title>Content/Block / title</title><text x="24" y="60" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="#F5F5EF">HashMap: поиск по ключу</text><text x="24" y="108.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Коллекция связывает ключ со значением. Найти</text><text x="24" y="135.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">данные можно по ключу, без последовательного</text><text x="24" y="162.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">просмотра всех элементов.</text></svg><text x="528" y="84" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#A6A6A0">Code/Block</text><svg xmlns="http://www.w3.org/2000/svg" width="488.0" height="278.8571428571429" viewBox="0 0 560 320" x="528" y="106"><title>Code/Block / default</title><rect x="16" y="18" width="528" height="153" rx="2" fill="#0A0A0A" stroke="#32372E" stroke-width="1" opacity="1" /><text x="28" y="49" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">1</text><text x="60" y="49" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">Map&lt;String, Integer&gt; counts = new HashMap&lt;&gt;();</text><text x="28" y="74" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">2</text><text x="60" y="74" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">for (String item : items) {</text><text x="28" y="99" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">3</text><text x="60" y="99" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">  counts.merge(item, 1, Integer::sum);</text><text x="28" y="124" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">4</text><text x="60" y="124" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">}</text><text x="28" y="149" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">5</text><text x="60" y="149" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#C4FF00">return counts;</text><text x="20" y="205" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A6A6A0">Java · Копировать</text></svg><text x="1032" y="84" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#A6A6A0">Table</text><svg xmlns="http://www.w3.org/2000/svg" width="488.0" height="278.8571428571429" viewBox="0 0 560 320" x="1032" y="106"><title>Table / default</title><text x="20" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">Операции Map</text><path d="M20 56H540" stroke="#32372E" stroke-width="1" /><text x="20" y="87" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Метод</text><text x="291.2" y="87" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Назначение</text><path d="M20 108H540" stroke="#32372E" stroke-width="1" /><text x="20" y="139" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="400" fill="#F5F5EF">get(key)</text><text x="291.2" y="139" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F5EF">Получить значение</text><path d="M20 160H540" stroke="#32372E" stroke-width="1" /><text x="20" y="191" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="400" fill="#F5F5EF">put(key, value)</text><text x="291.2" y="191" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F5EF">Сохранить значение</text><path d="M20 212H540" stroke="#32372E" stroke-width="1" /><text x="20" y="243" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="400" fill="#F5F5EF">containsKey(key)</text><text x="291.2" y="243" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F5EF">Проверить наличие</text></svg><text x="24" y="574" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#A6A6A0">Divider</text><svg xmlns="http://www.w3.org/2000/svg" width="488.0" height="41.82857142857143" viewBox="0 0 560 48" x="24" y="596"><title>Divider / plain</title><path d="M0 24H560" stroke="#32372E" stroke-width="1" /></svg><text x="528" y="574" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#A6A6A0">Task/EditorShell</text><svg xmlns="http://www.w3.org/2000/svg" width="488.0" height="315.7647058823529" viewBox="0 0 680 440" x="528" y="596"><title>Task/EditorShell / idle</title><rect x="0" y="0" width="680" height="440" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><text x="20" y="30" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#F5F5EF">Ваше решение</text><text x="660" y="30" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0" text-anchor="end">Java 21 · Main.java</text><text x="20" y="59" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A6A6A0">Черновик сохраняется на этом устройстве</text><text x="660" y="59" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A6A6A0" text-anchor="end">Сбросить код</text><rect x="12" y="78" width="656" height="153" rx="2" fill="#0A0A0A" stroke="#32372E" stroke-width="1" opacity="1" /><text x="24" y="109" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">1</text><text x="56" y="109" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#C4FF00">public class Main {</text><text x="24" y="134" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">2</text><text x="56" y="134" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#C4FF00">  public static void main(String[] args) {</text><text x="24" y="159" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">3</text><text x="56" y="159" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">    // Ваше решение</text><text x="24" y="184" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">4</text><text x="56" y="184" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">  }</text><text x="24" y="209" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">5</text><text x="56" y="209" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">}</text><text x="20" y="272" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A6A6A0">127 / 65 535 байт</text><path d="M20 292H660" stroke="#32372E" stroke-width="1" /><rect x="20" y="312" width="250" height="48" rx="2" fill="#C4FF00" opacity="1" /><text x="36" y="341.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#0A0A0A">Проверить решение</text><g transform="translate(238 327.0) scale(0.75)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="296" y="343" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Обновить статус</text><text x="20" y="407" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A6A6A0">Проверка решения не удаляет черновик.</text></svg><text x="1032" y="574" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#A6A6A0">Task/Status</text><svg xmlns="http://www.w3.org/2000/svg" width="440" height="192" viewBox="0 0 440 192" x="1032" y="596"><title>Task/Status / idle</title><rect x="0" y="0" width="440" height="192" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><g transform="translate(20 20) scale(1.0)"><path d="M8 6L2 12L8 18M16 6L22 12L16 18M14 3L10 21" fill="none" stroke="#A6A6A0" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="58" y="39" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">Готово к проверке</text><text x="20" y="83.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Можно отправить решение на проверку.</text><text x="20" y="169" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A6A6A0">Черновик не удаляется</text></svg><text x="24" y="1064" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#A6A6A0">Task/Result</text><svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" x="24" y="1086"><title>Task/Result / accepted</title><rect x="0" y="0" width="480" height="280" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><g transform="translate(20 20) scale(1.0)"><path d="M4 12L9 17L20 6" fill="none" stroke="#C4FF00" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="58" y="39" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">Решение принято</text><text x="20" y="83.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Все проверки пройдены.</text><text x="20" y="158" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Тесты</text><text x="460" y="158" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F5EF" text-anchor="end">18 / 18</text><text x="20" y="190" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Награда</text><text x="460" y="190" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#C4FF00" text-anchor="end">+120 XP</text><rect x="20" y="214" width="440" height="48" rx="2" fill="#C4FF00" opacity="1" /><text x="36" y="243.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#0A0A0A">Следующий урок</text><g transform="translate(428 229.0) scale(0.75)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g></svg><text x="528" y="1064" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#A6A6A0">Task/Transfer</text><svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" x="528" y="1086"><title>Task/Transfer / available</title><rect x="0" y="0" width="480" height="300" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><text x="20" y="29" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="400" fill="#A6A6A0">TRANSFER / UNGUIDED</text><text x="20" y="74" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#F5F5EF">Объединение заказов</text><text x="20" y="111.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">В систему приходят заказы из двух источников.</text><text x="20" y="135.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">Подготовьте единый список без повторной</text><text x="20" y="159.0" font-family="In