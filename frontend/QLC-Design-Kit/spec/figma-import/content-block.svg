<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1440" viewBox="0 0 2400 1440"><title>Content/Block</title><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="0" y="0" id="Content-Block--State-title"><title>Content/Block / title</title><text x="24" y="60" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="#F5F5EF">HashMap: поиск по ключу</text><text x="24" y="108.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Коллекция связывает ключ со значением. Найти</text><text x="24" y="135.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">данные можно по ключу, без последовательного</text><text x="24" y="162.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">просмотра всех элементов.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="600" y="0" id="Content-Block--State-subtitle"><title>Content/Block / subtitle</title><text x="24" y="60" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#F5F5EF">HashMap: поиск по ключу</text><text x="24" y="108.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Коллекция связывает ключ со значением. Найти</text><text x="24" y="135.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">данные можно по ключу, без последовательного</text><text x="24" y="162.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">просмотра всех элементов.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="1200" y="0" id="Content-Block--State-paragraph"><title>Content/Block / paragraph</title><text x="24" y="60" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#F5F5EF">HashMap: поиск по ключу</text><text x="24" y="108.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Коллекция связывает ключ со значением. Найти</text><text x="24" y="135.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">данные можно по ключу, без последовательного</text><text x="24" y="162.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">просмотра всех элементов.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="1800" y="0" id="Content-Block--State-image"><title>Content/Block / image</title><rect x="20" y="20" width="520" height="222" rx="2" fill="#0A0A0A" stroke="#66705D" stroke-width="1" opacity="1" /><g transform="translate(258.0 97) scale(1.8333333333333333)"><path d="M3 3H9V9H3ZM15 3H21V9H15ZM3 15H9V21H3ZM15 15H21V21H15Z" fill="none" stroke="#C4FF00" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="280.0" y="181" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0" text-anchor="middle">Изображение к уроку</text><text x="20" y="276" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Подпись и текстовое описание доступны рядом.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="0" y="360" id="Content-Block--State-diagram"><title>Content/Block / diagram</title><rect x="20" y="20" width="520" height="222" rx="2" fill="#0A0A0A" stroke="#66705D" stroke-width="1" opacity="1" /><rect x="36" y="86" width="138" height="70" rx="2" fill="#101210" stroke="#66705D" stroke-width="1" opacity="1" /><text x="105" y="128" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F5EF" text-anchor="middle">Ключ</text><g transform="translate(180 110) scale(0.8333333333333334)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#C4FF00" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><rect x="204" y="86" width="138" height="70" rx="2" fill="#101210" stroke="#66705D" stroke-width="1" opacity="1" /><text x="273" y="128" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F5EF" text-anchor="middle">HashMap</text><g transform="translate(348 110) scale(0.8333333333333334)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#C4FF00" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><rect x="372" y="86" width="138" height="70" rx="2" fill="#101210" stroke="#66705D" stroke-width="1" opacity="1" /><text x="441" y="128" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F5EF" text-anchor="middle">Значение</text><text x="20" y="276" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Подпись и текстовое описание доступны рядом.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="600" y="360" id="Content-Block--State-code"><title>Content/Block / code</title><rect x="16" y="18" width="528" height="153" rx="2" fill="#0A0A0A" stroke="#32372E" stroke-width="1" opacity="1" /><text x="28" y="49" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">1</text><text x="60" y="49" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">Map&lt;String, Integer&gt; counts = new HashMap&lt;&gt;();</text><text x="28" y="74" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">2</text><text x="60" y="74" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">for (String item : items) {</text><text x="28" y="99" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">3</text><text x="60" y="99" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">  counts.merge(item, 1, Integer::sum);</text><text x="28" y="124" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">4</text><text x="60" y="124" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#F5F5EF">}</text><text x="28" y="149" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#A6A6A0">5</text><text x="60" y="149" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400" fill="#C4FF00">return counts;</text><text x="20" y="205" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#A6A6A0">Java · Копировать</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="1200" y="360" id="Content-Block--State-table"><title>Content/Block / table</title><text x="20" y="34" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">Операции Map</text><path d="M20 56H540" stroke="#32372E" stroke-width="1" /><text x="20" y="87" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Метод</text><text x="291.2" y="87" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Назначение</text><path d="M20 108H540" stroke="#32372E" stroke-width="1" /><text x="20" y="139" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="400" fill="#F5F5EF">get(key)</text><text x="291.2" y="139" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F5EF">Получить значение</text><path d="M20 160H540" stroke="#32372E" stroke-width="1" /><text x="20" y="191" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="400" fill="#F5F5EF">put(key, value)</text><text x="291.2" y="191" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F5EF">Сохранить значение</text><path d="M20 212H540" stroke="#32372E" stroke-width="1" /><text x="20" y="243" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="400" fill="#F5F5EF">containsKey(key)</text><text x="291.2" y="243" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#F5F5EF">Проверить наличие</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="1800" y="360" id="Content-Block--State-list"><title>Content/Block / list</title><rect x="0" y="0" width="560" height="320" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><text x="24" y="54" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#C4FF00">01</text><text x="62" y="54" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Создайте коллекцию.</text><text x="24" y="122" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#C4FF00">02</text><text x="62" y="122" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Добавьте пары ключ–значение.</text><text x="24" y="190" font-family="IBM Plex Mono, monospace" font-size="12" font-weight="400" fill="#C4FF00">03</text><text x="62" y="190" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#F5F5EF">Проверьте результат поиска.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="0" y="720" id="Content-Block--State-quote"><title>Content/Block / quote</title><rect x="20" y="26" width="3" height="220" rx="0" fill="#A6A6A0" opacity="1" /><text x="44" y="63" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">Из документации</text><text x="44" y="105.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">Ключи должны сохранять согласованность equals</text><text x="44" y="132.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">и hashCode. Изменение ключа после вставки</text><text x="44" y="159.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">может нарушить поиск.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="600" y="720" id="Content-Block--State-warning"><title>Content/Block / warning</title><rect x="20" y="26" width="3" height="220" rx="0" fill="#E9D774" opacity="1" /><text x="44" y="63" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">Осторожно</text><text x="44" y="105.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">Ключи должны сохранять согласованность equals</text><text x="44" y="132.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">и hashCode. Изменение ключа после вставки</text><text x="44" y="159.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">может нарушить поиск.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="1200" y="720" id="Content-Block--State-tip"><title>Content/Block / tip</title><rect x="20" y="26" width="3" height="220" rx="0" fill="#C4FF00" opacity="1" /><text x="44" y="63" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">Подсказка</text><text x="44" y="105.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">Ключи должны сохранять согласованность equals</text><text x="44" y="132.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">и hashCode. Изменение ключа после вставки</text><text x="44" y="159.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">может нарушить поиск.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="1800" y="720" id="Content-Block--State-note"><title>Content/Block / note</title><rect x="20" y="26" width="3" height="220" rx="0" fill="#A6A6A0" opacity="1" /><text x="44" y="63" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">Примечание</text><text x="44" y="105.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">Ключи должны сохранять согласованность equals</text><text x="44" y="132.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">и hashCode. Изменение ключа после вставки</text><text x="44" y="159.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">может нарушить поиск.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="0" y="1080" id="Content-Block--State-details"><title>Content/Block / details</title><text x="20" y="52" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="500" fill="#F5F5EF">Почему поиск работает быстро</text><g transform="translate(516 34) scale(1.0)"><path d="M6 9L12 15L18 9" fill="none" stroke="#F5F5EF" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><path d="M20 77H540" stroke="#32372E" stroke-width="1" /><text x="20" y="112.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">Хеш помогает выбрать область поиска. При</text><text x="20" y="139.0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" fill="#A6A6A0">совпадении хешей сравниваются ключи.</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="600" y="1080" id="Content-Block--State-checkpoint"><title>Content/Block / checkpoint</title><rect x="0" y="0" width="560" height="320" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><text x="24" y="49" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Проверьте понимание</text><text x="24" y="80.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Что произойдёт при повторной записи по тому же ключу?</text><rect x="24" y="160" width="512" height="48" rx="2" fill="none" stroke="#66705D" stroke-width="1" opacity="1" /><text x="40" y="189.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5EF">Значение заменится</text><rect x="24" y="222" width="512" height="48" rx="2" fill="none" stroke="#66705D" stroke-width="1" opacity="1" /><text x="40" y="251.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5EF">Появится второй ключ</text></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="1200" y="1080" id="Content-Block--State-exercise"><title>Content/Block / exercise</title><rect x="0" y="0" width="560" height="320" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><text x="24" y="49" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Перейти к практике</text><text x="24" y="80.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Решите задачу на подсчёт частот.</text><rect x="24" y="150" width="512" height="48" rx="2" fill="#C4FF00" opacity="1" /><text x="40" y="179.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#0A0A0A">Открыть задачу</text><g transform="translate(504 165.0) scale(0.75)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#0A0A0A" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" x="1800" y="1080" id="Content-Block--State-embed"><title>Content/Block / embed</title><rect x="20" y="20" width="520" height="222" rx="2" fill="#0A0A0A" stroke="#66705D" stroke-width="1" opacity="1" /><g transform="translate(258.0 97) scale(1.8333333333333333)"><path d="M7 3L21 12L7 21Z" fill="none" stroke="#C4FF00" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="280.0" y="181" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0" text-anchor="middle">Видеоматериал</text><text x="20" y="276" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#A6A6A0">Подпись и текстовое описание доступны рядом.</text></svg></svg>