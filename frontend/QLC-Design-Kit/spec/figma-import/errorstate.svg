<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="580" viewBox="0 0 1840 580"><title>ErrorState</title><svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" x="0" y="0" id="ErrorState--State-generic"><title>ErrorState / generic</title><rect x="0" y="0" width="420" height="250" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><g transform="translate(24 25) scale(1.1666666666666667)"><path d="M12 3L22 21H2ZM12 9V14M12 17V18" fill="none" stroke="#FF8074" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="24" y="94" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Не удалось загрузить</text><text x="24" y="126.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">Попробуйте ещё раз немного позже.</text><rect x="24" y="188" width="372" height="48" rx="2" fill="none" stroke="#66705D" stroke-width="1" opacity="1" /><text x="40" y="217.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5EF">Повторить</text><g transform="translate(364 203.0) scale(0.75)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#F5F5EF" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" x="460" y="0" id="ErrorState--State-network"><title>ErrorState / network</title><rect x="0" y="0" width="420" height="250" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><g transform="translate(24 25) scale(1.1666666666666667)"><path d="M12 3L22 21H2ZM12 9V14M12 17V18" fill="none" stroke="#FF8074" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="24" y="94" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Нет соединения</text><text x="24" y="126.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">Проверьте соединение. Сохранённый</text><text x="24" y="150.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">черновик останется на этом устройстве.</text><rect x="24" y="188" width="372" height="48" rx="2" fill="none" stroke="#66705D" stroke-width="1" opacity="1" /><text x="40" y="217.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5EF">Повторить</text><g transform="translate(364 203.0) scale(0.75)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#F5F5EF" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" x="920" y="0" id="ErrorState--State-403"><title>ErrorState / 403</title><rect x="0" y="0" width="420" height="250" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><g transform="translate(24 25) scale(1.1666666666666667)"><path d="M12 3L22 21H2ZM12 9V14M12 17V18" fill="none" stroke="#FF8074" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="24" y="94" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Нет доступа</text><text x="24" y="126.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">Войдите в аккаунт с доступом к этому</text><text x="24" y="150.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">материалу.</text><rect x="24" y="188" width="372" height="48" rx="2" fill="none" stroke="#66705D" stroke-width="1" opacity="1" /><text x="40" y="217.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5EF">Войти</text><g transform="translate(364 203.0) scale(0.75)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#F5F5EF" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" x="1380" y="0" id="ErrorState--State-404"><title>ErrorState / 404</title><rect x="0" y="0" width="420" height="250" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><g transform="translate(24 25) scale(1.1666666666666667)"><path d="M12 3L22 21H2ZM12 9V14M12 17V18" fill="none" stroke="#FF8074" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="24" y="94" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Страница не найдена</text><text x="24" y="126.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">Адрес мог измениться. Откройте каталог</text><text x="24" y="150.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">курсов.</text><rect x="24" y="188" width="372" height="48" rx="2" fill="none" stroke="#66705D" stroke-width="1" opacity="1" /><text x="40" y="217.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5EF">В каталог</text><g transform="translate(364 203.0) scale(0.75)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#F5F5EF" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" x="0" y="290" id="ErrorState--State-500"><title>ErrorState / 500</title><rect x="0" y="0" width="420" height="250" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><g transform="translate(24 25) scale(1.1666666666666667)"><path d="M12 3L22 21H2ZM12 9V14M12 17V18" fill="none" stroke="#FF8074" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="24" y="94" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Ошибка сервера</text><text x="24" y="126.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">Попробуйте ещё раз немного позже.</text><rect x="24" y="188" width="372" height="48" rx="2" fill="none" stroke="#66705D" stroke-width="1" opacity="1" /><text x="40" y="217.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5EF">Повторить</text><g transform="translate(364 203.0) scale(0.75)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#F5F5EF" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" x="460" y="290" id="ErrorState--State-maintenance"><title>ErrorState / maintenance</title><rect x="0" y="0" width="420" height="250" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><g transform="translate(24 25) scale(1.1666666666666667)"><path d="M12 3L22 21H2ZM12 9V14M12 17V18" fill="none" stroke="#E9D774" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="24" y="94" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Технические работы</text><text x="24" y="126.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">Попробуйте ещё раз немного позже.</text><rect x="24" y="188" width="372" height="48" rx="2" fill="none" stroke="#66705D" stroke-width="1" opacity="1" /><text x="40" y="217.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5EF">Повторить</text><g transform="translate(364 203.0) scale(0.75)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#F5F5EF" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" x="920" y="290" id="ErrorState--State-offline"><title>ErrorState / offline</title><rect x="0" y="0" width="420" height="250" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><g transform="translate(24 25) scale(1.1666666666666667)"><path d="M12 3L22 21H2ZM12 9V14M12 17V18" fill="none" stroke="#FF8074" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="24" y="94" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Вы не в сети</text><text x="24" y="126.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">Проверьте соединение. Сохранённый</text><text x="24" y="150.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">черновик останется на этом устройстве.</text><rect x="24" y="188" width="372" height="48" rx="2" fill="none" stroke="#66705D" stroke-width="1" opacity="1" /><text x="40" y="217.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5EF">Повторить</text><g transform="translate(364 203.0) scale(0.75)"><path d="M4 12H20M14 6L20 12L14 18" fill="none" stroke="#F5F5EF" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g></svg><svg xmlns="http://www.w3.org/2000/svg" width="420" height="250" viewBox="0 0 420 250" x="1380" y="290" id="ErrorState--State-reconnecting"><title>ErrorState / reconnecting</title><rect x="0" y="0" width="420" height="250" rx="2" fill="#101210" stroke="#32372E" stroke-width="1" opacity="1" /><g transform="translate(24 25) scale(1.1666666666666667)"><path d="M20 8A9 9 0 1 0 20 17M20 2V8H14" fill="none" stroke="#FF8074" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" /></g><text x="24" y="94" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500" fill="#F5F5EF">Восстанавливаем связь</text><text x="24" y="126.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">Проверьте соединение. Сохранённый</text><text x="24" y="150.0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#A6A6A0">черновик останется на этом устройстве.</text><rect x="24" y="188" width="372" height="48" rx="2" fill="none" stroke="#66705D" stroke-width="1" opacity="1" /><circle cx="46" cy="212.0" r="7" fill="none" stroke="#F5F5EF" stroke-width="2" /><text x="64" y="217.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#F5F5EF">Подождите</text></svg></svg>