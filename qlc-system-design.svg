<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2580" viewBox="0 0 2400 2580" role="img" aria-labelledby="title desc">
  <title id="title">QLC — схема системы</title>
  <desc id="desc">Текущая архитектура QLC: путь ученика, Next.js и Spring Boot, PostgreSQL и Redis Stream, асинхронная проверка кода в одноразовом Docker-контейнере, отдельная проверка тестовых и числовых задач, запуск dev и prod, CI и метрики.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#18211d" stroke-width="1"/>
    </pattern>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1110"/><stop offset="1" stop-color="#070a09"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b18"/><stop offset="1" stop-color="#101512"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2ff47"/><stop offset="1" stop-color="#96e321"/>
    </linearGradient>
    <linearGradient id="headerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#adf53a" stop-opacity=".13"/><stop offset="1" stop-color="#adf53a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#adf53a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowMute" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#71847a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
      .white{fill:#f4f7f2}.muted{fill:#a9b7ab}.dim{fill:#738478}.lime{fill:#b5fa40}.cyan{fill:#85d9cb}.amber{fill:#f4ca82}
      .kicker{font-size:20px;font-weight:800;letter-spacing:3px}.section{font-size:32px;font-weight:750;letter-spacing:-.5px}
      .title{font-size:70px;font-weight:800;letter-spacing:-3px}.subtitle{font-size:24px;font-weight:450}
      .cardtitle{font-size:28px;font-weight:750;letter-spacing:-.35px}.body{font-size:21px;font-weight:450}.small{font-size:18px;font-weight:470}.micro{font-size:16px;font-weight:700;letter-spacing:1.3px}
      .card{fill:#111915;stroke:#334139;stroke-width:2}.card2{fill:#151d18;stroke:#3b4e3f;stroke-width:2}
      .line{fill:none;stroke:#adf53a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .muteLine{fill:none;stroke:#71847a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowMute)}
      .dash{fill:none;stroke:#91ad8c;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:8 10;marker-end:url(#arrowMute)}
    </style>
  </defs>

  <rect width="2400" height="2580" fill="url(#canvas)"/>
  <rect width="2400" height="2580" fill="url(#grid)" opacity=".5"/>
  <rect width="2400" height="215" fill="url(#headerGlow)"/>
  <rect x="80" y="66" width="86" height="86" rx="24" fill="url(#green)"/>
  <circle cx="123" cy="109" r="23" fill="none" stroke="#0d140d" stroke-width="4"/>
  <ellipse cx="123" cy="109" rx="31" ry="10" transform="rotate(-31 123 109)" fill="none" stroke="#0d140d" stroke-width="4"/>
  <circle cx="148" cy="94" r="5" fill="#0d140d"/>
  <text x="194" y="92" class="lime kicker">QLC / SYSTEM DESIGN</text>
  <text x="190" y="161" class="white title">Как работает платформа</text>
  <text x="194" y="198" class="muted subtitle">Путь ученика, жизненный цикл решения и границы системы — по текущему коду ветки develop</text>
  <rect x="1954" y="76" width="366" height="50" rx="25" fill="#1a2b1b" stroke="#56783d" stroke-width="2"/>
  <circle cx="1981" cy="101" r="7" fill="#b5fa40"/>
  <text x="2002" y="108" class="lime small" font-weight="750">ТЕКУЩАЯ РЕАЛИЗАЦИЯ</text>
  <line x1="80" y1="235" x2="2320" y2="235" stroke="#314136" stroke-width="2"/>

  <!-- 01 / learner story -->
  <text x="80" y="290" class="lime kicker">01 / USER STORY</text>
  <text x="80" y="331" class="white section">От каталога до засчитанной задачи</text>
  <rect x="80" y="361" width="2240" height="208" rx="28" fill="url(#panel)" stroke="#314136" stroke-width="2"/>
  <path class="line" d="M505 465H541"/><path class="line" d="M952 465H988"/><path class="line" d="M1399 465H1435"/><path class="line" d="M1846 465H1882"/>
  <g>
    <rect x="108" y="391" width="397" height="148" rx="21" class="card"/>
    <circle cx="150" cy="431" r="22" fill="#263925"/><text x="137" y="438" class="lime small" font-weight="800">01</text>
    <text x="185" y="439" class="white cardtitle">Выбрать курс</text>
    <text x="140" y="487" class="muted body">Публичный каталог и описание</text>
    <text x="140" y="515" class="dim small">без авторизации</text>
  </g>
  <g>
    <rect x="555" y="391" width="397" height="148" rx="21" class="card"/>
    <circle cx="597" cy="431" r="22" fill="#263925"/><text x="584" y="438" class="lime small" font-weight="800">02</text>
    <text x="632" y="439" class="white cardtitle">Войти / получить доступ</text>
    <text x="587" y="487" class="muted body">Email / Telegram · корзина</text>
    <text x="587" y="515" class="dim small">checkout выдаёт доступ без оплаты</text>
  </g>
  <g>
    <rect x="1002" y="391" width="397" height="148" rx="21" class="card"/>
    <circle cx="1044" cy="431" r="22" fill="#263925"/><text x="1031" y="438" class="lime small" font-weight="800">03</text>
    <text x="1079" y="439" class="white cardtitle">Изучать урок</text>
    <text x="1034" y="487" class="muted body">Теория, задачи и редактор</text>
    <text x="1034" y="515" class="dim small">доступ проверяет backend</text>
  </g>
  <g>
    <rect x="1449" y="391" width="397" height="148" rx="21" class="card"/>
    <circle cx="1491" cy="431" r="22" fill="#263925"/><text x="1478" y="438" class="lime small" font-weight="800">04</text>
    <text x="1526" y="439" class="white cardtitle">Отправить решение</text>
    <text x="1481" y="487" class="muted body">Код → очередь · тест/число</text>
    <text x="1481" y="515" class="dim small">→ проверка в API</text>
  </g>
  <g>
    <rect x="1896" y="391" width="396" height="148" rx="21" class="card2"/>
    <circle cx="1938" cy="431" r="22" fill="#334a24"/><text x="1925" y="438" class="lime small" font-weight="800">05</text>
    <text x="1973" y="439" class="white cardtitle">Увидеть вердикт</text>
    <text x="1928" y="487" class="muted body">AC / WA / CE / TLE / MLE…</text>
    <text x="1928" y="515" class="dim small">история и прогресс в БД</text>
  </g>

  <!-- 02 / architecture -->
  <text x="80" y="642" class="lime kicker">02 / SYSTEM MAP</text>
  <text x="80" y="684" class="white section">Кто с кем говорит</text>
  <rect x="80" y="714" width="2240" height="602" rx="30" fill="url(#panel)" stroke="#314136" stroke-width="2"/>
  <text x="120" y="761" class="dim micro">КЛИЕНТ</text>
  <text x="574" y="761" class="dim micro">WEB EDGE</text>
  <text x="1002" y="761" class="dim micro">ПРИЛОЖЕНИЕ</text>
  <text x="1819" y="761" class="dim micro">СОСТОЯНИЕ И ДОСТАВКА</text>

  <rect x="120" y="790" width="383" height="373" rx="24" class="card"/>
  <circle cx="167" cy="842" r="23" fill="#263b25"/>
  <path d="M155 842h24M167 830v24" stroke="#b5fa40" stroke-width="3" stroke-linecap="round"/>
  <text x="202" y="853" class="white cardtitle">Браузер</text>
  <text x="152" y="911" class="muted body">Каталог, урок, профиль</text>
  <text x="152" y="949" class="muted body">Monaco · черновик кода</text>
  <text x="152" y="987" class="muted body">JWT · запросы к /api</text>
  <line x1="152" y1="1022" x2="471" y2="1022" stroke="#314136" stroke-width="2"/>
  <text x="152" y="1060" class="lime small">GET /submissions/{id}</text>
  <text x="152" y="1090" class="dim small">polling до финального статуса</text>

  <path class="line" d="M503 964H559"/>
  <rect x="574" y="790" width="366" height="373" rx="24" class="card"/>
  <circle cx="622" cy="842" r="23" fill="#263b25"/>
  <path d="M611 849l10-15 11 15" fill="none" stroke="#b5fa40" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="659" y="853" class="white cardtitle">Next.js</text>
  <text x="606" y="911" class="muted body">Страницы и UI</text>
  <text x="606" y="949" class="muted body">frontend-процесс</text>
  <text x="606" y="987" class="muted body">/api/* → Spring API</text>
  <line x1="606" y1="1022" x2="908" y2="1022" stroke="#314136" stroke-width="2"/>
  <text x="606" y="1060" class="lime small">qlcode.me</text>
  <text x="606" y="1090" class="dim small">rewrite к backend</text>

  <path class="line" d="M940 964H990"/>
  <rect x="1005" y="790" width="726" height="373" rx="24" class="card2"/>
  <rect x="1037" y="817" width="235" height="39" rx="19" fill="#293c22"/>
  <circle cx="1058" cy="837" r="6" fill="#b5fa40"/>
  <text x="1076" y="843" class="lime micro">SPRING BOOT</text>
  <text x="1037" y="902" class="white cardtitle">Backend · один процесс</text>
  <text x="1037" y="951" class="muted body">HTTP API: auth / catalog / admin CRUD / tasks</text>
  <text x="1037" y="985" class="muted body">Проверка доступа, JWT, сервисы и JPA</text>
  <line x1="1037" y1="1018" x2="1698" y2="1018" stroke="#344538" stroke-width="2"/>
  <text x="1037" y="1061" class="cyan body">CODE</text>
  <text x="1127" y="1061" class="muted body">→ Stream worker + recovery + Docker CLI</text>
  <text x="1037" y="1098" class="amber body">TEST / NUMERIC</text>
  <text x="1224" y="1098" class="muted body">→ мгновенная проверка в API</text>

  <path class="line" d="M1731 892H1799"/>
  <rect x="1814" y="790" width="466" height="161" rx="23" class="card"/>
  <circle cx="1855" cy="838" r="9" fill="#85d9cb"/>
  <text x="1882" y="849" class="white cardtitle">PostgreSQL</text>
  <text x="1845" y="893" class="muted body">Курсы, пользователи, решения</text>
  <text x="1845" y="921" class="cyan small">источник истины · Flyway</text>

  <path class="line" d="M1731 1063H1799"/>
  <rect x="1814" y="1002" width="466" height="161" rx="23" class="card"/>
  <circle cx="1855" cy="1050" r="9" fill="#f4ca82"/>
  <text x="1882" y="1061" class="white cardtitle">Redis Stream</text>
  <text x="1845" y="1105" class="muted body">Очередь CODE-сабмишенов</text>
  <text x="1845" y="1133" class="amber small">доставка, pending, retry</text>

  <line x1="120" y1="1190" x2="2280" y2="1190" stroke="#304137" stroke-width="2"/>
  <text x="120" y="1241" class="dim micro">СВЯЗИ И МЕТРИКИ</text>
  <rect x="383" y="1207" width="412" height="57" rx="17" fill="#19221c" stroke="#3b4b3e" stroke-width="2"/>
  <text x="408" y="1243" class="muted small">Resend · письма и сброс пароля</text>
  <rect x="818" y="1207" width="412" height="57" rx="17" fill="#19221c" stroke="#3b4b3e" stroke-width="2"/>
  <text x="845" y="1243" class="muted small">Telegram Login · подпись локально</text>
  <rect x="1253" y="1207" width="490" height="57" rx="17" fill="#19221c" stroke="#3b4b3e" stroke-width="2"/>
  <text x="1280" y="1243" class="muted small">Docker Engine · запуск judge-образов</text>
  <rect x="1766" y="1207" width="514" height="57" rx="17" fill="#19221c" stroke="#3b4b3e" stroke-width="2"/>
  <text x="1792" y="1243" class="muted small">Actuator · health / prometheus</text>

  <!-- 03 / code pipeline -->
  <text x="80" y="1388" class="lime kicker">03 / CODE SUBMISSION PIPELINE</text>
  <text x="80" y="1430" class="white section">Один CODE-сабмишен: от POST до вердикта</text>
  <rect x="80" y="1460" width="2240" height="415" rx="30" fill="url(#panel)" stroke="#314136" stroke-width="2"/>
  <path class="line" d="M420 1602H465"/><path class="line" d="M791 1602H836"/><path class="line" d="M1162 1602H1207"/><path class="line" d="M1533 1602H1578"/><path class="line" d="M1904 1602H1949"/>
  <g>
    <rect x="109" y="1503" width="311" height="206" rx="22" class="card"/>
    <text x="135" y="1546" class="lime kicker">01</text>
    <text x="135" y="1595" class="white cardtitle">Принять POST</text>
    <text x="135" y="1634" class="muted small">Доступ, язык, лимит</text>
    <text x="135" y="1662" class="muted small">размера, idempotency key</text>
  </g>
  <g>
    <rect x="480" y="1503" width="311" height="206" rx="22" class="card"/>
    <text x="506" y="1546" class="lime kicker">02</text>
    <text x="506" y="1595" class="white cardtitle">Сохранить</text>
    <text x="506" y="1634" class="muted small">Submission = QUEUED</text>
    <text x="506" y="1662" class="cyan small">COMMIT в PostgreSQL</text>
  </g>
  <g>
    <rect x="851" y="1503" width="311" height="206" rx="22" class="card"/>
    <text x="877" y="1546" class="lime kicker">03</text>
    <text x="877" y="1595" class="white cardtitle">Опубликовать</text>
    <text x="877" y="1634" class="muted small">После commit → Redis</text>
    <text x="877" y="1662" class="amber small">Stream / consumer group</text>
  </g>
  <g>
    <rect x="1222" y="1503" width="311" height="206" rx="22" class="card"/>
    <text x="1248" y="1546" class="lime kicker">04</text>
    <text x="1248" y="1595" class="white cardtitle">Захватить</text>
    <text x="1248" y="1634" class="muted small">Worker: row lock, token</text>
    <text x="1248" y="1662" class="muted small">QUEUED → COMPILING</text>
  </g>
  <g>
    <rect x="1593" y="1503" width="311" height="206" rx="22" class="card2"/>
    <text x="1619" y="1546" class="lime kicker">05</text>
    <text x="1619" y="1595" class="white cardtitle">Запустить judge</text>
    <text x="1619" y="1634" class="muted small">Новый Docker-контейнер</text>
    <text x="1619" y="1662" class="muted small">compile → приватные тесты</text>
  </g>
  <g>
    <rect x="1964" y="1503" width="327" height="206" rx="22" class="card2"/>
    <text x="1990" y="1546" class="lime kicker">06</text>
    <text x="1990" y="1595" class="white cardtitle">Зафиксировать</text>
    <text x="1990" y="1634" class="muted small">FINISHED + verdict в БД</text>
    <text x="1990" y="1662" class="muted small">ACK Redis · polling UI</text>
    <text x="1990" y="1690" class="dim small">или INFRA_ERROR после retries</text>
  </g>
  <rect x="109" y="1737" width="1038" height="104" rx="20" fill="#172319" stroke="#486544" stroke-width="2"/>
  <circle cx="147" cy="1776" r="8" fill="#b5fa40"/>
  <text x="169" y="1783" class="white body" font-weight="700">Если Redis или worker недоступен</text>
  <text x="139" y="1815" class="muted small">Recovery перечитывает QUEUED / зависшие попытки из БД и переотправляет.</text>
  <rect x="1173" y="1737" width="1118" height="104" rx="20" fill="#1c211a" stroke="#665e42" stroke-width="2"/>
  <circle cx="1211" cy="1776" r="8" fill="#f4ca82"/>
  <text x="1233" y="1783" class="white body" font-weight="700">TEST / NUMERIC — другой маршрут</text>
  <text x="1203" y="1815" class="muted small">Ответ сравнивается в Spring API, сразу сохраняется FINISHED; Redis / Docker не нужны.</text>

  <!-- 04 / inside the judge -->
  <text x="80" y="1943" class="lime kicker">04 / EXECUTION ARCHITECTURE</text>
  <text x="80" y="1985" class="white section">Что происходит внутри проверки кода</text>
  <rect x="80" y="2010" width="2240" height="343" rx="30" fill="url(#panel)" stroke="#314136" stroke-width="2"/>
  <rect x="111" y="2063" width="433" height="242" rx="22" class="card"/>
  <text x="141" y="2108" class="lime micro">НА ХОСТЕ · SPRING BACKEND</text>
  <text x="141" y="2156" class="white cardtitle">DockerCodeRunner</text>
  <text x="141" y="2193" class="muted small">Создаёт временные файлы</text>
  <text x="141" y="2222" class="muted small">source → readonly mount</text>
  <text x="141" y="2251" class="muted small">testCases JSON → stdin</text>
  <text x="141" y="2280" class="cyan small">Выбирает образ и лимиты языка</text>
  <path class="line" d="M544 2187H594"/>
  <rect x="611" y="2047" width="1678" height="268" rx="24" fill="#17201a" stroke="#708e45" stroke-width="2"/>
  <rect x="644" y="2070" width="545" height="40" rx="19" fill="#2a3922"/>
  <circle cx="668" cy="2090" r="6" fill="#b5fa40"/>
  <text x="689" y="2096" class="lime micro">ОДНОРАЗОВЫЙ DOCKER-КОНТЕЙНЕР</text>
  <text x="1951" y="2098" class="dim micro">--RM</text>
  <rect x="643" y="2132" width="473" height="128" rx="19" class="card"/>
  <text x="668" y="2173" class="white cardtitle">judge.py</text>
  <text x="668" y="2207" class="muted small">Компиляция / проверка исходника</text>
  <text x="668" y="2235" class="muted small">CE сразу; иначе цикл по тестам</text>
  <path class="line" d="M1116 2196H1158"/>
  <rect x="1173" y="2132" width="473" height="128" rx="19" class="card"/>
  <text x="1198" y="2173" class="white cardtitle">qlc-sandbox</text>
  <text x="1198" y="2207" class="muted small">На каждом приватном тесте</text>
  <text x="1198" y="2235" class="muted small">время · память · вывод</text>
  <path class="line" d="M1646 2196H1688"/>
  <rect x="1703" y="2132" width="553" height="128" rx="19" class="card2"/>
  <text x="1728" y="2173" class="white cardtitle">Сравнить и вернуть JSON</text>
  <text x="1728" y="2207" class="muted small">stdout ↔ expectedOutput</text>
  <text x="1728" y="2235" class="muted small">AC / WA / CE / TLE / MLE / RE / OLE</text>
  <text x="645" y="2291" class="dim small">Изоляция: no network · read-only FS · non-root · cap-drop · CPU / RAM / pids · контейнер и temp удаляются</text>

  <!-- 05 / operations -->
  <text x="80" y="2422" class="lime kicker">05 / DELIVERY &amp; OBSERVABILITY</text>
  <text x="80" y="2464" class="white section">Как это запускается и проверяется</text>
  <g>
    <rect x="80" y="2490" width="530" height="67" rx="19" class="card"/>
    <text x="106" y="2519" class="lime small" font-weight="800">ОБРАЗЫ</text>
    <text x="106" y="2544" class="muted small">C++23 · Java 21 · CPython 3.12 · PyPy 3.12</text>
  </g>
  <g>
    <rect x="633" y="2490" width="530" height="67" rx="19" class="card"/>
    <text x="659" y="2519" class="lime small" font-weight="800">DEV</text>
    <text x="659" y="2544" class="muted small">App на хосте · PG / Redis в Compose</text>
  </g>
  <g>
    <rect x="1186" y="2490" width="530" height="67" rx="19" class="card"/>
    <text x="1212" y="2519" class="lime small" font-weight="800">PROD</text>
    <text x="1212" y="2544" class="muted small">App на хосте · Neon + Redis в Compose</text>
  </g>
  <g>
    <rect x="1739" y="2490" width="581" height="67" rx="19" class="card"/>
    <text x="1765" y="2519" class="lime small" font-weight="800">МЕТРИКИ / CI</text>
    <text x="1765" y="2544" class="muted small">Actuator endpoint · GitHub Actions тестирует</text>
  </g>
</svg>
