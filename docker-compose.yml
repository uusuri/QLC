services:
  # Контейнер базы данных PostgreSQL 17
  postgres:
    image: postgres:17-alpine
    container_name: qlc_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # Контейнер Redis для сессий и очередей
  redis:
    image: redis:7.2-alpine
    container_name: qlc_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./redis_data:/data
    # Заставляем Redis сбрасывать данные на диск каждые 60 секунд, если изменился хотя бы 1 ключ
    command: redis-server --save 60 1 --loglevel warning
