name: Backend CI

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'backend/**' # Запускать только если изменился код в папке бэкенда
  pull_request:
    branches: [ "develop" ]
    paths:
      - 'backend/**'

jobs:
  build-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle' # Кеширование зависимостей Gradle

    - name: Grant execute permission for gradlew
      run: chmod +x backend/gradlew

    - name: Build Backend Project
      run: |
        cd backend
        ./gradlew build -x test --no-daemon
