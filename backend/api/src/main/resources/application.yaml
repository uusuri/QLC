spring:
  config:
    import: classpath:qlc-persistence.yml
  application:
    name: qlc-api
  profiles:
    default: dev
  task:
    scheduling:
      pool:
        size: 2
  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

# Можно переопределить в окружении через JWT_EXPIRATION (значение в миллисекундах).
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

app:
  frontend-url: ${FRONTEND_PUBLIC_URL:https://qlcode.me}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@mail.qlcode.me}
    resend-api-key: ${RESEND_API_KEY:}
  submissions:
    max-size: 65535
    max-log-length: 10000
    recovery:
      enabled: true
      poll-delay-ms: 5000
      execution-timeout-ms: 900000

server:
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
