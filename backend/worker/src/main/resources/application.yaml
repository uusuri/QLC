spring:
  config:
    import: classpath:qlc-persistence.yml
  application:
    name: qlc-worker
  profiles:
    default: dev
  flyway:
    enabled: false

# No application HTTP API here: this listener exposes local health and metrics only.
server:
  address: 127.0.0.1
  port: ${WORKER_MANAGEMENT_PORT:9094}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

app:
  submissions:
    worker:
      enabled: true
      consumer-group: "submission-workers"
      consumer-name: "${WORKER_ID:}"
      poll-delay-ms: 500
      batch-size: 10
      reclaim-min-idle-ms: 900000
