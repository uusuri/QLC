spring:
  application:
    name: qlc-backend
  profiles:
    active: dev
  task:
    scheduling:
      pool:
        size: 2
  data: 
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    default-property-inclusion: non_null

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 64

# Можно переопределить в окружении через JWT_EXPIRATION (значение в миллисекундах).
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

app:
  submissions:
    max-size: 65535
    max-log-length: 10000
    stream-name: "qlc:submissions"
    recovery:
      enabled: true
      poll-delay-ms: 5000
      execution-timeout-ms: 900000
    worker:
      enabled: true
      consumer-group: "submission-workers"
      consumer-name: "${WORKER_ID:}"
      poll-delay-ms: 500
      batch-size: 10
      reclaim-min-idle-ms: 900000

server:
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
